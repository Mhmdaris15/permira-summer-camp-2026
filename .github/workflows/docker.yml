name: Docker Build & Publish

# Builds both images on GitHub's runners (7–16GB RAM) and pushes them to the
# GitHub Container Registry. Coolify then PULLS the prebuilt images instead of
# compiling on the VPS — no more OOM/timeout on the loaded 8GB box.
#
# Images:
#   ghcr.io/<owner>/<repo>/web
#   ghcr.io/<owner>/<repo>/api
# (the owner segment is lowercased automatically by docker/metadata-action)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required so GITHUB_TOKEN can push packages to GHCR.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: Dockerfile.web
          - image: api
            dockerfile: Dockerfile.api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (skip on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Push on branch/tag pushes; build-only on PRs (validation).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # VITE_API_URL is baked into the web bundle at build time. Set a repo
          # variable VITE_API_URL to override; falls back to the known API host.
          build-args: |
            VITE_API_URL=${{ matrix.image == 'web' && (vars.VITE_API_URL || 'https://api-summercamp2026.permiraspb.org') || '' }}
            API_ORIGIN=${{ matrix.image == 'web' && (vars.VITE_API_URL || 'https://api-summercamp2026.permiraspb.org') || '' }}
