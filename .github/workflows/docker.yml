name: Docker Build & Publish

# Builds both images on GitHub's runners (7–16GB RAM) and pushes them to the
# GitHub Container Registry. Coolify then PULLS the prebuilt images instead of
# compiling on the VPS — no more OOM/timeout on the loaded 8GB box.
#
# Images:
#   ghcr.io/<owner>/<repo>/web
#   ghcr.io/<owner>/<repo>/api
# (the owner segment is lowercased automatically by docker/metadata-action)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required so GITHUB_TOKEN can push packages to GHCR.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: Dockerfile.web
          - image: api
            dockerfile: Dockerfile.api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (skip on PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Push on branch/tag pushes; build-only on PRs (validation).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # VITE_API_URL is baked into the web bundle at build time. Set a repo
          # variable VITE_API_URL to override; falls back to the known API host.
          build-args: |
            VITE_API_URL=${{ matrix.image == 'web' && (vars.VITE_API_URL || 'https://api-summercamp2026.permiraspb.org') || '' }}
            API_ORIGIN=${{ matrix.image == 'web' && (vars.VITE_API_URL || 'https://api-summercamp2026.permiraspb.org') || '' }}

  # ---------------------------------------------------------------------------
  # Trigger a Coolify redeploy AFTER both images are published. Coolify then
  # pulls the fresh :latest images (docker-compose.prod.yml). Only runs on a
  # real push to main — never on PRs.
  #
  # Configure once in GitHub → Settings → Secrets and variables → Actions:
  #   COOLIFY_WEBHOOK  (required)  the resource's Deploy Webhook URL, e.g.
  #                                https://<coolify-host>/api/v1/deploy?uuid=XXXXXXXX
  #   COOLIFY_TOKEN    (optional)  Coolify API token; sent as Bearer if set.
  # If COOLIFY_WEBHOOK is unset the job no-ops (so the workflow still passes).
  # ---------------------------------------------------------------------------
  deploy:
    name: Trigger Coolify deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Call Coolify deploy webhook
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::COOLIFY_WEBHOOK secret not set — skipping auto-deploy."
            exit 0
          fi
          echo "Triggering Coolify deploy…"
          code=$(curl -fsS -o /dev/null -w "%{http_code}" \
            ${TOKEN:+-H "Authorization: Bearer $TOKEN"} \
            "$WEBHOOK" || true)
          echo "Coolify responded: HTTP $code"
          case "$code" in
            2*) echo "✅ Deploy triggered." ;;
            *)  echo "::error::Coolify webhook failed (HTTP $code)."; exit 1 ;;
          esac
