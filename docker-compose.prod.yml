# =============================================================================
# PRODUCTION compose for Coolify — PULLS prebuilt images from GHCR.
# No `build:` sections, so Coolify never compiles on the VPS.
#
# Point the Coolify resource's "Docker Compose" file at THIS file.
# Images are published by .github/workflows/docker.yml on push to main.
#
# Image tag: defaults to :latest. Override per-deploy with WEB_IMAGE / API_IMAGE
# env (e.g. pin to a commit: ghcr.io/.../web:sha-abc1234).
# =============================================================================

services:
  api:
    image: ${API_IMAGE:-ghcr.io/mhmdaris15/permira-summer-camp-2026/api:latest}
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      SERVICE_FQDN_API_8787: ${API_FQDN:-https://api-summercamp2026.permiraspb.org}
      NODE_ENV: production
      PORT: 8787
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-lite}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://summercamp2026.permiraspb.org}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-300}
      RATE_LIMIT_TIGHT: ${RATE_LIMIT_TIGHT:-10}
    volumes:
      - permira-data:/app/server/data
      - permira-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - permira-net
    labels:
      - coolify.managed=true
      - coolify.type=application
      - coolify.name=permira-api

  web:
    image: ${WEB_IMAGE:-ghcr.io/mhmdaris15/permira-summer-camp-2026/web:latest}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SERVICE_FQDN_WEB_80: ${WEB_FQDN:-https://summercamp2026.permiraspb.org}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - permira-net
    labels:
      - coolify.managed=true
      - coolify.type=application
      - coolify.name=permira-web

volumes:
  permira-data:
    name: permira-data
  permira-uploads:
    name: permira-uploads

networks:
  permira-net:
    driver: bridge
