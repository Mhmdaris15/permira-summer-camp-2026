# =============================================================================
# nginx for the Vite SPA.
# Split-domain deploy — API lives on its own origin, so this server does
# NOT reverse-proxy /api. The SPA hits the API directly via VITE_API_URL,
# guarded by Express CORS on the API side.
#
# `__API_ORIGIN__` is rewritten to the real API origin at image build time
# (see Dockerfile.web). That value is then included in the CSP connect-src
# directive so the browser is allowed to make XHR/fetch to it.
# =============================================================================

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Hardening ----
  server_tokens off;
  client_max_body_size 1m;             # SPA only — uploads go straight to API.

  add_header X-Frame-Options           "DENY"                                    always;
  add_header X-Content-Type-Options    "nosniff"                                 always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"         always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"     always;

  # Content Security Policy.
  # connect-src includes the API origin so cross-origin fetch/XHR works.
  # `unsafe-inline` on style-src is required by Tailwind v4 utility output.
  # R2 hosts (custom domain + account endpoint) are allowed in img/object/frame
  # so the admin dashboard can preview passport & student-card presigned URLs.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://storage.permiraspb.org https://*.r2.cloudflarestorage.com; object-src 'self' https://storage.permiraspb.org https://*.r2.cloudflarestorage.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; connect-src 'self' __API_ORIGIN__; frame-src https://drive.google.com https://www.youtube-nocookie.com https://www.youtube.com https://storage.permiraspb.org https://*.r2.cloudflarestorage.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # ---- Health probe (used by Docker HEALTHCHECK) ----
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # ---- Static assets — long cache, immutable hashes from Vite ----
  # Includes 3D assets (gltf/glb/bin) so kit models are cached aggressively
  # after first load — no re-download on subsequent reloads in production.
  location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|webp|gif|ico|gltf|glb|bin)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ---- SPA fallback ----
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the entry HTML — must always reflect the latest deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
